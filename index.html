<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>
    <style>
        /* ตั้งค่าพื้นหลังและการจัดวางให้อยู่กึ่งกลาง */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117; /* พื้นหลังสีดาร์กที่เข้ากับแสงเหนือ */
            color: #ffffff; /* ตัวอักษรสีขาว */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; 
        }

        .aurora-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* ให้อยู่ด้านหลังสุด */
            overflow: hidden;
            pointer-events: none;
        }

        .aurora {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                radial-gradient(ellipse at 50% 50%, rgba(0, 255, 128, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(128, 0, 255, 0.2) 0%, transparent 40%),
                radial-gradient(ellipse at 20% 80%, rgba(0, 128, 255, 0.2) 0%, transparent 40%);
            filter: blur(60px);
            animation: moveAurora 20s linear infinite alternate;
        }

        @keyframes moveAurora {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            50% {
                transform: translate(-10%, 10%) rotate(5deg) scale(1.1);
            }
            100% {
                transform: translate(10%, -10%) rotate(-5deg) scale(1.0);
            }
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            z-index: 0;
            animation: twinkle infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; }
            100% { opacity: 0.8; }
        }

        .shooting-star {
            position: absolute;
            width: 150px;
            height: 2px;
            background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,1), rgba(255,255,255,0));
            z-index: 1;
            transform: rotate(-45deg); /* ให้ดาวตกเฉียงลง */
            animation: shoot linear forwards;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes shoot {
            0% { transform: translateX(0) translateY(0) rotate(-45deg); opacity: 1; }
            100% { transform: translateX(-1000px) translateY(1000px) rotate(-45deg); opacity: 0; }
        }

        .content-container {
            z-index: 10;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .header-title {
            font-size: 1.5em;
            color: #dddddd;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        img {
            max-width: 100%;
            height: auto;
            max-height: 50vh;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        h1 {
            margin: 10px 0 5px 0;
            font-size: 2em;
        }

    </style>
</head>
<body>

    <!-- คอนเทนเนอร์แสงเหนือ -->
    <div class="aurora-container">
        <div class="aurora"></div>
    </div>

    <!-- คอนเทนเนอร์หลัก -->
    <div class="content-container">
        <!-- เพิ่มข้อความผู้จัดทำด้านบน -->
        <div class="header-title">ผู้จัดทำ</div>
        
        <img src="e1.png" alt="Profile Image">
        
        <!-- เอาส่วนเลขที่ออก เหลือแค่ชื่อ -->
        <h1>วีรศักดิ์ สุนเสน</h1>
    </div>

    <script>
        // สร้างดาวพื้นหลัง
        function createStars() {
            const numStars = 150;
            for (let i = 0; i < numStars; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                let size = Math.random() * 2.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.animationDuration = (Math.random() * 3 + 1) + 's';
                star.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(star);
            }
        }

        // สร้างดาวตก
        function createShootingStar() {
            let shootingStar = document.createElement('div');
            shootingStar.className = 'shooting-star';
            
            // สุ่มตำแหน่งเริ่มต้นให้เยื้องไปทางขวาบน
            shootingStar.style.left = (Math.random() * 100 + 20) + 'vw'; 
            shootingStar.style.top = (Math.random() * 50 - 20) + 'vh';
            
            // สุ่มความเร็ว
            let duration = Math.random() * 1.5 + 0.8;
            shootingStar.style.animationDuration = duration + 's';
            
            document.body.appendChild(shootingStar);

            // ลบทิ้งเมื่ออนิเมชันจบเพื่อไม่ให้รกเครื่อง
            setTimeout(() => {
                shootingStar.remove();
            }, duration * 1000);
        }

        window.onload = () => {
            createStars();
            // สุ่มปล่อยดาวตกเป็นระยะๆ (ทุกๆ 2-4 วินาที)
            setInterval(() => {
                createShootingStar();
            }, Math.random() * 2000 + 2000);
        };
    </script>

</body>
</html>
